<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="{{CSP}}" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{CSS_URI}}" />
{{NLS}}
</head>
<body>
  <div class="xfilter">
    <div class="xfinput">
      <input id="xfilterInput" type="text" placeholder="Find…" data-i18n-ph="files.find" spellcheck="false" autocomplete="off" />
      <button class="xfclear" id="xfClear" type="button" title="Clear" data-i18n-title="files.clear" hidden>×</button>
    </div>
    <button class="xmaster" id="masterSort" type="button" data-i18n-title="files.sort.master" title="Sort all folders — the global default"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M4 17l3 3 3-3"/><path d="M13.5 6h6M13.5 11h4.5M13.5 16h3"/></svg></button>
  </div>
  <nav class="explorer" id="explorer" aria-label="AIOS Explorer" tabindex="0">
    <!-- sections injected by files.js -->
  </nav>

  <!-- right-click affordance — explicit labels so actions can't be misread -->
  <div class="ctx" id="ctx" role="menu" hidden>
    <button class="ctxitem" id="ctxTerminalHere" role="menuitem" type="button" data-i18n="files.ctx.terminalHere">Open terminal here</button>
    <button class="ctxitem" id="ctxTerminal" role="menuitem" type="button" data-i18n="files.ctx.sendPath">Send path to terminal</button>
    <button class="ctxitem" id="ctxCopy" role="menuitem" type="button" data-i18n="files.ctx.copyPath">Copy path</button>
    <button class="ctxitem" id="ctxReveal" role="menuitem" type="button" data-i18n="files.ctx.reveal">Reveal in Finder</button>
  </div>

  <!-- per-folder sort menu (AI-58) — opened from a Workspace-folder header -->
  <div class="ctx" id="sortMenu" role="menu" hidden>
    <button class="ctxitem" id="sortName" role="menuitem" type="button" data-i18n="files.sort.name">Name (A→Z)</button>
    <button class="ctxitem" id="sortMtime" role="menuitem" type="button" data-i18n="files.sort.mtime">Last modified (newest)</button>
  </div>

<script nonce="{{NONCE}}" src="{{JS_URI}}"></script>
</body>
</html>
