name: Publish to Open VSX

# Tag a release (vX.Y.Z) → this packages the extension and publishes it to the
# Open VSX registry. Teammates who installed AIOS Glass from Open VSX then
# auto-update on their next IDE refresh — "they do nothing." You can also run it
# manually from the Actions tab (workflow_dispatch).
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

# Needed by the Release step at the end of the job. Absent, the default GITHUB_TOKEN can be
# read-only (GitHub's newer default) and `gh release create` fails with a 403 — on the first
# tag that uses it, which is a release. Stated rather than inherited.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies -o aios-glass.vsix

      # Re-tagging or a manual re-run must not fail on "version already exists".
      # Query Open VSX for this package.json version; only publish if it's new.
      - name: Check whether this version is already on Open VSX
        id: check
        run: |
          VER=$(node -p "require('./package.json').version")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/the-aios/aios-glass/$VER")
          if [ "$CODE" = "200" ]; then
            echo "v$VER is already published on Open VSX — skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$VER is new — will publish."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Open VSX
        if: steps.check.outputs.exists == 'false'
        run: npx --yes ovsx publish aios-glass.vsix -p "$OVSX_TOKEN"
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}

      - name: Keep the .vsix as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: aios-glass-vsix
          path: aios-glass.vsix

      # AI-119: a GitHub Release used to be a SECOND, HAND-DONE act after the tag, and the
      # roadmap carried a row for exactly the divergence that invites — one release whose
      # content mattered most to the bus protocol was, for a while, the one that could not be
      # resolved to a commit. Two hand-coordinated steps drift; one automated step cannot.
      # So the tag that publishes to Open VSX now also cuts the Release, from the same tag,
      # with the .vsix attached so a human can install the exact artifact that was published.
      #
      # Placed LAST and deliberately allowed to fail loudly: by this point Open VSX already has
      # the extension, so a failure here loses nothing and is recoverable by hand — whereas a
      # silent skip would recreate the very gap this step closes. `--verify-tag` refuses to
      # invent a tag that does not exist, and the `|| upload` fallback makes a re-run idempotent.
      - name: Cut the GitHub Release from the same tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "AIOS Glass $TAG" --generate-notes --verify-tag \
            aios-glass.vsix \
          || gh release upload "$TAG" aios-glass.vsix --clobber
